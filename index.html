<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURORA POS</title>
  <link rel="stylesheet" href="core/core.css">
  <link rel="stylesheet" href="modules/caja/caja.css">
  <link rel="stylesheet" href="modules/inventario/inventario.css">
  <link rel="stylesheet" href="modules/config/config.css">
  <link rel="stylesheet" href="modules/finanzas/finanzas.css">
  <link rel="stylesheet" href="modules/reportes/reportes.css">
  <link rel="stylesheet" href="modules/compras/compras.css">
  <link rel="stylesheet" href="modules/automatizacion/automatizacion.css">
</head>
<body>
  <div id="moduleContainer"></div>

  <script src="core/nucleo.js"></script>
  <script src="modules/caja/caja.js"></script>
  <script src="modules/inventario/inventario.js"></script>
  <script src="modules/config/config.js"></script>
  <script src="modules/finanzas/finanzas.js"></script>
  <script src="modules/reportes/reportes.js"></script>
  <script src="modules/compras/compras.js"></script>
  <script src="modules/automatizacion/automatizacion.js"></script>

  <script>
    (function () {
      'use strict';

      // Puente entre el NÚCLEO y cada módulo. Reenvía los hooks que el módulo defina:
      //   boot (una sola vez), init, onShow, onHide, onEscape(e), onKey(e).
      // Los hooks onEscape/onKey/onHide/boot SOLO se registran si el módulo los tiene,
      // porque el NÚCLEO trata distinto a los módulos que declaran onEscape.
      // soloAdmin:true oculta la solapa y bloquea el acceso a usuarios con rol Cajero.
      function registrar(id, def, getModulo) {
        const puente = {
          name: def.name,
          icon: def.icon,
          soloAdmin: !!def.soloAdmin,
          init: function () { const m = getModulo(); if (m && m.init) m.init(); },
          onShow: function () { const m = getModulo(); if (m && m.onShow) m.onShow(); }
        };
        const real = getModulo();
        if (real) {
          ['boot', 'onHide', 'onEscape', 'onKey'].forEach(function (hook) {
            if (typeof real[hook] === 'function') {
              puente[hook] = function (e) { return getModulo()[hook](e); };
            }
          });
        }
        NUCLEO.registerModule(id, puente);
      }

      document.addEventListener('DOMContentLoaded', function () {
        if (typeof NUCLEO === 'undefined') {
          document.body.innerHTML = '<div style="padding:2rem;color:red;font-family:monospace;">ERROR: El NÚCLEO no se cargó correctamente.</div>';
          return;
        }

        // Orden de las solapas
        registrar('caja',       { name: 'CAJA',       icon: 'point_of_sale' },           function () { return window.CAJA; });
        registrar('inventario', { name: 'INVENTARIO', icon: 'inventory_2' },             function () { return window.INVENTARIO; });
        registrar('compras',    { name: 'COMPRAS',    icon: 'shopping_cart',    soloAdmin: true }, function () { return typeof ComprasModule !== 'undefined' ? ComprasModule : null; });
        registrar('finanzas',   { name: 'FINANZAS',   icon: 'account_balance_wallet', soloAdmin: true }, function () { return window.FINANZAS; });
        registrar('reportes',   { name: 'REPORTES',   icon: 'analytics',        soloAdmin: true }, function () { return window.REPORTES; });
        registrar('config',     { name: 'CONFIG',     icon: 'settings',         soloAdmin: true }, function () { return window.CONFIG; });
        // AUTOMATIZACIÓN se registra sola (noTab) desde su propio archivo.

        // Mostrar CAJA por defecto
        NUCLEO.showTab('caja');
      });
    })();
  </script>
</body>
</html>
